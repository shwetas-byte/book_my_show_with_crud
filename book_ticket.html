<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Book Tickets - BookMyShow</title>
<link rel="stylesheet" href="index.css">
<link rel="stylesheet" href="book_ticket.css">
</head>
<body>

  <!-- Top Header -->
  <header class="top-header">
    <div class="logo">
      book<span class="logo-highlight">my</span>show
    </div>

    <div class="search-bar">
      <svg class="search-icon" viewBox="0 0 24 24" width="18" height="18">
        <path fill="none" stroke="#8b8b8b" stroke-width="2" d="M21 21l-4.35-4.35m1.35-5.65a7 7 0 1 1-14 0 7 7 0 0 1 14 0z"/>
      </svg>
      <input type="text" placeholder="Search for Movies, Events, Plays, Sports and Activities">
    </div>

    <div class="header-right">
      <div class="city-selector">
        Bhopal
        <svg viewBox="0 0 24 24" width="14" height="14">
          <path fill="#4a4a4a" d="M7 10l5 5 5-5z"/>
        </svg>
      </div>
      <button class="signin-btn">Sign in</button>
    </div>
  </header>

  <!-- Movie Info Bar (title, runtime, genre tags) -->
  <section class="movie-info-bar" id="movieInfoBar">
    <p class="loading-text">Loading...</p>
  </section>

  <!-- Date Strip + Filter Row -->
  <section class="booking-controls">
    <div class="date-strip" id="dateStrip">
      <!-- JS: 3 date boxes yahan banenge -->
    </div>

    <div class="filter-row">
      <div class="filter-dropdown" id="langFormatFilter">
        <button class="filter-btn">Language - Format <span class="arrow">&#9662;</span></button>
        <div class="filter-menu">
           <label><input type="checkbox" data-language="Hindi"> Hindi</label>
            <label><input type="checkbox" data-language="English"> English</label>
            <hr>
            <label><input type="checkbox" data-format="2D"> 2D</label>
            <label><input type="checkbox" data-format="IMAX"> IMAX</label>
            <label><input type="checkbox" data-format="3D"> 3D</label>
        </div>
      </div>

      <div class="filter-dropdown" id="priceFilter">
        <button class="filter-btn">Price Range <span class="arrow">&#9662;</span></button>
        <div class="filter-menu"></div>
      </div>

      <div class="filter-dropdown" id="timeFilter">
        <button class="filter-btn">Preferred Time <span class="arrow">&#9662;</span></button>
        <div class="filter-menu"></div>
      </div>

      <div class="filter-dropdown" id="sortFilter">
        <button class="filter-btn">Sort By <span class="arrow">&#9662;</span></button>
        <div class="filter-menu">
          <label data-sort="rating-high">Rating: High to Low</label>
          <label data-sort="price-low">Price: Low to High</label>
          <label data-sort="price-high">Price: High to Low</label>

        </div>
      </div>

      <div class="search-box">
        <input type="text" id="cinemaSearch" placeholder="Search cinemas">
        <svg viewBox="0 0 24 24" width="16" height="16">
          <path fill="none" stroke="#8b8b8b" stroke-width="2" d="M21 21l-4.35-4.35m1.35-5.65a7 7 0 1 1-14 0 7 7 0 0 1 14 0z"/>
        </svg>
      </div>
    </div>
  </section>

  <!-- Legend -->
  <div class="status-legend">
    <span class="legend-item"><span class="dot available"></span> AVAILABLE</span>
    <span class="legend-item"><span class="dot fast-filling"></span> FAST FILLING</span>
  </div>

  <!-- Cinema List -->
  <main class="cinema-list" id="cinemaList">
    <!-- JS: cinema cards yahan banenge -->
  </main>

  <script src="index.js"></script>
  <script src="book_ticket.js"></script>
</body>
</html>
