<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BookMyShow Clone</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Top Header -->
  <header class="top-header">
    <div class="logo">
      book<span class="logo-highlight">my</span>show
    </div>

    <div class="search-bar">
      <svg class="search-icon" viewBox="0 0 24 24" width="18" height="18">
        <path fill="none" stroke="#8b8b8b" stroke-width="2" d="M21 21l-4.35-4.35m1.35-5.65a7 7 0 1 1-14 0 7 7 0 0 1 14 0z"/>
      </svg>
      <input type="text" placeholder="Search for Movies, Events, Plays, Sports and Activities">
    </div>

    <div class="header-right">
      <div class="city-selector">
        Bhopal
        <svg viewBox="0 0 24 24" width="14" height="14">
          <path fill="#4a4a4a" d="M7 10l5 5 5-5z"/>
        </svg>
      </div>
      <button class="signin-btn" > <a href="login.html">Sign in</a></button>
      <div class="hamburger">
        <span></span>
        <span></span>
        <span></span>
      </div>
    </div>
  </header>

  <!-- Secondary Nav -->
  <nav class="sub-nav">
    <ul class="nav-left">
      <li>Movies</li>
      <li>Stream</li>
      <li>Events</li>
      <li>Plays</li>
      <li>Sports</li>
      <li>Activities</li>
    </ul>
    <ul class="nav-right">
      <li>ListYourShow</li>
      <li>Corporates</li>
      <li>Offers</li>
      <li>Gift Cards</li>
    </ul>
  </nav>

  <!-- Main Content -->
  <main class="content">
    <h2 class="section-title">Recommended Movies</h2>

    <div class="carousel-wrapper">
      <button class="carousel-arrow">&#10094;</button>

      <div class="movie-grid" id="movieGrid">

        
        

        

        

        

      </div>
    </div>
  </main>

  <script src="index.js"></script>

</body>
</html>
